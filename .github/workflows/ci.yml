name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        run: |
          brew install python@3.12 2>/dev/null || true
          echo "$(brew --prefix python@3.12)/libexec/bin" >> $GITHUB_PATH

      - name: Install test deps
        run: |
          python3 -m pip install --user -r requirements.txt pytest

      - name: Compile check
        run: python3 -m py_compile main.py core/*.py skills/*.py

      - name: Run tests
        run: python3 -m pytest tests/ -v
