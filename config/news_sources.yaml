# Research URLs — structured as {fetch_filter, sources[]}
# Only sources with access: free are auto-fetched; others are reference-only
research_urls:
  fetch_filter: free

  sources:
    # --- Macro / Inflation / Deflation ---
    - name: Hoisington Quarterly Review & Outlook
      url: https://hoisington.com/economic_overview.html
      author: Lacy Hunt
      category: macro_deflation
      access: free
      format: pdf_quarterly
      note: letters published ~2 weeks after quarter end

    - name: Goehring & Rozencwajg Quarterly Commentary
      url: https://www.gorozen.com/commentaries
      author: Leigh Goehring & Adam Rozencwajg
      category: energy,commodities
      access: free
      format: pdf_quarterly

    - name: Goehring & Rozencwajg Blog
      url: https://blog.gorozen.com/blog
      author: Leigh Goehring & Adam Rozencwajg
      category: energy,commodities
      access: free
      format: blog

    - name: Art Berman Blog
      url: https://www.artberman.com
      author: Art Berman
      category: energy
      access: free
      format: blog
      note: detailed oil supply/demand charts

    # --- Geopolitics ---
    - name: Geopolitical Futures (George Friedman)
      url: https://geopoliticalfutures.com
      author: George Friedman
      category: geopolitics
      access: free
      format: articles
      note: some free weekly articles; full access paid

    - name: Geopolitical Alpha (Marko Papic)
      url: https://www.geopoliticalalpha.com
      author: Marko Papic
      category: geopolitics
      access: free
      format: articles
      note: constraints-based framework; BCA Research institutional work is separate/paid

    # --- Reference only (free_and_paid — not auto-fetched) ---
    - name: Lyn Alden Research
      url: https://www.lynalden.com
      author: Lyn Alden
      category: macro_inflation,dollar_bear
      access: free_and_paid
      format: articles

    - name: Lyn Alden Substack
      url: https://lynalden.substack.com
      author: Lyn Alden
      category: macro_inflation,dollar_bear
      access: free_and_paid
      format: substack

    - name: Capital Wars (Michael Howell Substack)
      url: https://substack.com/@capitalwars
      author: Michael Howell
      category: liquidity
      access: free_and_paid
      format: substack
      note: 51K+ subscribers, ranked #4 Finance on Substack

    - name: Energy Outlook Advisors (Anas Alhajji Substack)
      url: https://anasalhajjieoa.substack.com
      author: Anas Alhajji
      category: energy
      access: free_and_paid
      format: substack

    - name: 42 Macro Free Sample
      url: https://42macro.com/42-macro-sample
      author: Darius Dale
      category: liquidity
      access: free_sample
      format: report
