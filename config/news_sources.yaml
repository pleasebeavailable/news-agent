rss_feeds:
  # Tier 1: Most reliable, free, fast
  - name: Reuters Business
    url: https://news.google.com/rss/search?q=when:24h+allinurl:reuters.com+business&ceid=US:en&hl=en-US&gl=US
    tier: 1
  - name: CNBC Top News
    url: https://www.cnbc.com/id/100003114/device/rss/rss.html
    tier: 1
  - name: CNBC World
    url: https://www.cnbc.com/id/100727362/device/rss/rss.html
    tier: 1
  - name: MarketWatch Top Stories
    url: https://feeds.content.dowjones.io/public/rss/mw_topstories
    tier: 1
  - name: MarketWatch Markets
    url: https://feeds.content.dowjones.io/public/rss/mw_marketpulse
    tier: 1
  - name: Yahoo Finance
    url: https://finance.yahoo.com/news/rssindex
    tier: 1
  - name: AP Business
    url: https://news.google.com/rss/search?q=when:24h+allinurl:apnews.com+business&ceid=US:en&hl=en-US&gl=US
    tier: 1
  - name: BBC Business
    url: http://feeds.bbci.co.uk/news/business/rss.xml
    tier: 1

  # Tier 1+: Paid subscription
  - name: Seeking Alpha
    url: https://seekingalpha.com/market_currents.xml
    tier: 1
    api: true
    note: paid subscription — use API for deep research (Skill 6), RSS for monitoring (Skill 2)

  # Tier 2: Good but verify claims
  - name: Investing.com News
    url: https://www.investing.com/rss/news.rss
    tier: 2
  - name: ZeroHedge
    url: https://feeds.feedburner.com/zerohedge/feed
    tier: 2
    trust_flag: editorial

  # Tier 3: Paywalled, headlines only
  - name: FT Markets
    url: https://www.ft.com/rss/home
    tier: 3
    note: may only get headlines
  - name: Bloomberg
    url: https://feeds.bloomberg.com/markets/news.rss
    tier: 3
    note: often restricted

  # Geopolitics focused
  - name: Al Jazeera English
    url: https://www.aljazeera.com/xml/rss/all.xml
    tier: 1
    geo: true
  - name: BBC World
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    tier: 1
    geo: true
  - name: Guardian World
    url: https://www.theguardian.com/world/rss
    tier: 1
    geo: true

