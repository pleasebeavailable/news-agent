version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /lib
  - /proc
  - /dev/urandom
  - /app
  - /etc
  - /var/log
  read_write:
  - /sandbox
  - /tmp
  - /dev/null
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  # ── IDE / tooling ──────────────────────────────────────────────
  claude_code:
    name: claude-code
    endpoints:
    - host: api.anthropic.com
      port: 443
      protocol: rest
      tls: terminate
      enforcement: enforce
      rules:
      - allow: { method: "*", path: "/**" }
    - host: statsig.anthropic.com
      port: 443
    - host: sentry.io
      port: 443
    - host: raw.githubusercontent.com
      port: 443
    - host: platform.claude.com
      port: 443
    binaries:
    - path: /usr/local/bin/claude
    - path: /usr/bin/node

  cursor:
    name: cursor
    endpoints:
    - host: cursor.blob.core.windows.net
      port: 443
    - host: api2.cursor.sh
      port: 443
    - host: repo.cursor.sh
      port: 443
    - host: download.cursor.sh
      port: 443
    - host: cursor.download.prss.microsoft.com
      port: 443
    binaries:
    - path: /usr/bin/curl
    - path: /usr/bin/wget
    - path: /sandbox/.cursor-server/**

  opencode:
    name: opencode
    endpoints:
    - host: registry.npmjs.org
      port: 443
    - host: opencode.ai
      port: 443
    - host: integrate.api.nvidia.com
      port: 443
    binaries:
    - path: /usr/lib/node_modules/opencode-ai/bin/.opencode
    - path: /usr/bin/node
    - path: /usr/local/bin/opencode

  vscode:
    name: vscode
    endpoints:
    - host: update.code.visualstudio.com
      port: 443
    - host: az764295.vo.msecnd.net
      port: 443
    - host: vscode.download.prss.microsoft.com
      port: 443
    - host: marketplace.visualstudio.com
      port: 443
    - host: gallerycdn.vsassets.io
      port: 443
    binaries:
    - path: /usr/bin/curl
    - path: /usr/bin/wget
    - path: /sandbox/.vscode-server/**
    - path: /sandbox/.vscode-remote-containers/**

  # ── Git ────────────────────────────────────────────────────────
  github_rest_api:
    name: github-rest-api
    endpoints:
    - host: api.github.com
      port: 443
      protocol: rest
      tls: terminate
      enforcement: enforce
      access: read-only
    binaries:
    - path: /usr/local/bin/claude
    - path: /usr/bin/gh

  github_ssh_over_https:
    name: github-ssh-over-https
    endpoints:
    - host: github.com
      port: 443
      protocol: rest
      tls: terminate
      enforcement: enforce
      rules:
      - allow: { method: GET, path: "/**/info/refs*" }
      - allow: { method: POST, path: "/**/git-upload-pack" }
    binaries:
    - path: /usr/bin/git

  # ── Package managers ───────────────────────────────────────────
  pypi:
    name: pypi
    endpoints:
    - host: pypi.org
      port: 443
    - host: files.pythonhosted.org
      port: 443
    - host: github.com
      port: 443
    - host: objects.githubusercontent.com
      port: 443
    - host: api.github.com
      port: 443
    - host: downloads.python.org
      port: 443
    binaries:
    - path: /sandbox/.venv/bin/python
    - path: /sandbox/.venv/bin/python3
    - path: /sandbox/.venv/bin/pip
    - path: /app/.venv/bin/python
    - path: /app/.venv/bin/python3
    - path: /app/.venv/bin/pip
    - path: /usr/local/bin/uv
    - path: /sandbox/.uv/python/**

  # ── NemoClaw bot ───────────────────────────────────────────────
  nvidia_inference:
    name: nvidia-inference
    endpoints:
    - host: inference.local
      port: 443
      protocol: rest
      enforcement: enforce
      tls: terminate
      rules:
      - allow: { method: "*", path: "/**" }
    - host: integrate.api.nvidia.com
      port: 443
      protocol: rest
      enforcement: enforce
      tls: terminate
      rules:
      - allow: { method: "*", path: "/**" }
    binaries:
    - path: /sandbox/.venv/bin/python3
    - path: /sandbox/.venv/bin/python
    - path: /sandbox/.uv/python/**
    - path: /usr/bin/python3
    - path: /usr/bin/curl
    - path: /usr/local/bin/opencode

  telegram:
    name: telegram
    endpoints:
    - host: api.telegram.org
      port: 443
      protocol: rest
      enforcement: enforce
      tls: terminate
      rules:
      - allow: { method: GET, path: "/bot*/**" }
      - allow: { method: POST, path: "/bot*/**" }
    binaries:
    - path: /sandbox/.venv/bin/python3
    - path: /sandbox/.venv/bin/python
    - path: /sandbox/.uv/python/**
    - path: /usr/bin/python3
    - path: /usr/bin/curl

  yahoo_finance:
    name: yahoo-finance
    endpoints:
    - host: finance.yahoo.com
      port: 443
    - host: query1.finance.yahoo.com
      port: 443
    - host: query2.finance.yahoo.com
      port: 443
    - host: fc.yahoo.com
      port: 443
    binaries:
    - path: /sandbox/.venv/bin/python3
    - path: /sandbox/.venv/bin/python
    - path: /sandbox/.uv/python/**
    - path: /usr/bin/python3

  rss_feeds:
    name: rss-feeds
    endpoints:
    # Tier 1 financial
    - host: feeds.content.dowjones.io
      port: 443
    - host: feeds.marketwatch.com
      port: 443
    - host: www.cnbc.com
      port: 443
    - host: feeds.bbci.co.uk
      port: 443
    - host: feeds.feedburner.com
      port: 443
    - host: www.investing.com
      port: 443
    - host: seekingalpha.com
      port: 443
    - host: news.google.com
      port: 443
    # Tier 3 / paywalled
    - host: www.ft.com
      port: 443
    - host: feeds.bloomberg.com
      port: 443
    # Geopolitics
    - host: www.aljazeera.com
      port: 443
    - host: www.theguardian.com
      port: 443
    # Research URLs (free)
    - host: hoisington.com
      port: 443
    - host: www.gorozen.com
      port: 443
    - host: blog.gorozen.com
      port: 443
    - host: www.artberman.com
      port: 443
    - host: geopoliticalfutures.com
      port: 443
    - host: www.geopoliticalalpha.com
      port: 443
    # RSS bridge / aggregators
    - host: rsshub.app
      port: 443
    binaries:
    - path: /sandbox/.venv/bin/python3
    - path: /sandbox/.venv/bin/python
    - path: /sandbox/.uv/python/**
    - path: /usr/bin/python3
