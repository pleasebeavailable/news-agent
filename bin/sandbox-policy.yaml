# OpenShell sandbox policy for NemoClaw on macOS (Docker-based Linux VM with Landlock+seccomp)
# Docs: https://docs.nvidia.com/nemoclaw/sandbox-policy

version: "1"
runtime: docker  # macOS requires Docker Desktop or Colima (Podman NOT supported)

filesystem:
  allow:
    - path: "~/openclaw-agent/"
      mode: rw
    - path: "/tmp/openclaw/"
      mode: rw
    # Inside the container these map to:
    #   ~/openclaw-agent/ -> /sandbox/workspace
    #   /tmp/openclaw/    -> /sandbox/tmp

  deny:
    - path: "~/.ssh/"
    - path: "~/.gnupg/"
    - path: "~/.config/google-chrome/"
    - path: "~/.config/chromium/"
    - path: "~/work/"
    - path: "~/.aws/"
    - path: "~/.kube/"
    # All other system paths are read-only by default inside the container

network:
  default: deny  # deny-by-default for all outbound traffic

  allow:
    # WhatsApp (Baileys protocol)
    - host: "web.whatsapp.com"
      ports: [443]
    - host: "mmg.whatsapp.net"
      ports: [443]
    - host: "media.whatsapp.net"
      ports: [443]
    - host: "pps.whatsapp.net"
      ports: [443]

    # NVIDIA inference API
    - host: "integrate.api.nvidia.com"
      ports: [443]
    - host: "build.nvidia.com"
      ports: [443]

    # PyPI — package installation
    - host: "pypi.org"
      ports: [443]
    - host: "files.pythonhosted.org"
      ports: [443]

    # Telegram
    - host: "api.telegram.org"
      ports: [443]

    # Financial data
    - host: "finance.yahoo.com"
      ports: [443]
    - host: "query1.finance.yahoo.com"
      ports: [443]
    - host: "query2.finance.yahoo.com"
      ports: [443]

    # RSS feeds
    - host: "feeds.marketwatch.com"
      ports: [443]
    - host: "www.cnbc.com"
      ports: [443]
    - host: "feeds.bbci.co.uk"
      ports: [443]
    - host: "finance.yahoo.com"
      ports: [443]
    - host: "feeds.feedburner.com"
      ports: [443]
    - host: "www.investing.com"
      ports: [443]
    - host: "rsshub.app"
      ports: [443]
    - host: "seekingalpha.com"
      ports: [443]

process:
  max_memory_mb: 4096   # 4 GB cap (machine has 24 GB)
  max_cpu_percent: 50
  max_pids: 256
